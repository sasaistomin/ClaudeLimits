name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS — сборка, установка, тесты
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: bash tests/ci-report.sh bash tests/smoke.sh
      - name: Все тесты
        if: always()
        run: bash tests/ci-report.sh bash tests/macos/run.sh

  windows:
    name: Windows — ${{ matrix.ps }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]   # Windows PowerShell 5.1 (как у пользователей) и PowerShell 7
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        shell: bash
        run: bash tests/ci-report.sh ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tests/windows/smoke.ps1
      - name: Тесты, установка, значок в трее, удаление
        if: always()
        shell: bash
        run: bash tests/ci-report.sh ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tests/windows/run-tests.ps1

  linux-logic:
    name: Linux — логика Windows-версии (pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: bash tests/ci-report.sh pwsh -NoProfile -File tests/windows/smoke.ps1
      - name: Все тесты
        if: always()
        run: bash tests/ci-report.sh pwsh -NoProfile -File tests/windows/run-tests.ps1

  scriptable:
    name: Виджет Scriptable (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Логика и отрисовка виджета
        run: bash tests/ci-report.sh node tests/scriptable/test.js

  linux:
    name: Linux (Ubuntu) — установка, значок в трее, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты (GTK, AppIndicator, виртуальный дисплей)
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 libnotify-bin xvfb
      - name: Smoke
        run: bash tests/ci-report.sh xvfb-run -a bash tests/smoke.sh
      - name: Все тесты
        if: always()
        run: bash tests/ci-report.sh xvfb-run -a bash tests/linux/run.sh

  linux-fresh:
    name: Linux — установка с нуля (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: Ubuntu, image: "ubuntu:24.04", pre: "apt-get update && apt-get install -y python3 curl xvfb xauth" }
          - { distro: Fedora, image: "fedora:latest", pre: "dnf install -y python3 curl xorg-x11-server-Xvfb xorg-x11-xauth which procps-ng util-linux" }
    steps:
      - uses: actions/checkout@v4
      - name: Чистая система
        run: ${{ matrix.pre }}
      - name: install.sh сам ставит пакеты и настраивает Claude Code
        env: { CLAUDE_LIMITS_NO_LAUNCH: "1", DEBIAN_FRONTEND: noninteractive }
        run: |
          bash linux/install.sh
          out=$(echo '{"model":{"display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":42,"resets_at":9999999999}}}' | sh -c "$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.claude/settings.json")))["statusLine"]["command"])')")
          echo "$out"; [ "$out" = "[Opus] 5h: 42%" ]
          CLAUDE_LIMITS_SELFTEST=1 xvfb-run -a python3 ~/.local/share/claude-limits/claude_limits.py | tee /tmp/st.txt
          grep -q "SELFTEST OK" /tmp/st.txt
          bash ~/.local/share/claude-limits/uninstall.sh
